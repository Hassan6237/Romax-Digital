{% extends "layout.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="auth-card">
  <h2 class="section-title">Create your account</h2>
  <p class="section-sub">Save pass designs, manage members, and connect real Apple &amp; Google Wallet credentials.</p>

  <form method="POST" class="auth-form">
    <div class="field-grid">
      <div class="field-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required autocomplete="name"
               value="{{ form.name or '' }}" placeholder="Jane Doe" />
      </div>
      <div class="field-group">
        <label for="organisation">Organisation</label>
        <input type="text" id="organisation" name="organisation" autocomplete="organization"
               value="{{ form.organisation or '' }}" placeholder="Your Organisation" />
      </div>
    </div>
    <div class="field-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email"
             value="{{ form.email or '' }}" placeholder="you@yourorganisation.co.uk" />
    </div>
    <div class="field-grid">
      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password"
               minlength="8" placeholder="At least 8 characters" />
      </div>
      <div class="field-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" required autocomplete="new-password"
               minlength="8" placeholder="Repeat password" />
      </div>
    </div>
    <label class="radio-option auth-remember">
      <input type="checkbox" name="accept_terms" required />
      <span>I accept the <a href="https://romax.co.uk/digital/" target="_blank">Terms &amp; Conditions</a></span>
    </label>
    <button type="submit" class="btn-primary auth-submit">Create Account</button>
  </form>

  <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
